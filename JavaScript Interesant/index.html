<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Lesson 34</title>

	<link rel="stylesheet" type="text/css" href="style.css">
	<link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
	<nav>
		<img src="img/logo.png" style="width:60px; height: 60px;">
		<div id="myLinks">
			<a href="#news">News</a>
			<a href="#contact">Contact</a>
			<a href="#about">About</a>			
		</div>
		<button class="icon" onclick="openMenu()">
			<i class="fa fa-bars"></i>
		</button>
	</nav>


	<h1>Slideshow, Hamburger Menu, and Filter/Search List</h1>

	<div id="slideWrapper">
		<div class="slide">
			<img src="img/a.jpg" style="width: 100%;">
		</div>
		<div class="slide">
			<img src="img/b.jpg" style="width: 100%;">
		</div>
		<div class="slide">
			<img src="img/c.jpg" style="width: 100%;">
		</div>
	</div>

	<a class="prev"><img src="img/back.png" style="width:50px; height: 50px;" onclick="plusSlides(-1)"></a>
	<a class="next"><img src="img/forward.png" style="width:50px; height: 50px;" onclick="plusSlides(1)"></a>

	<br>
	<br>

	<input type="text" name="search" id="myInput" placeholder="Search for names..." onkeyup="search()">

	<ul id="myList">
		<li>John</li>
		<li>Filani</li>
		<li>John</li>
		<li>John</li>
		<li>Fisteku</li>
		<li>John</li>
		<li>Liraku</li>
	</ul>

	<br>
	<br>	<br>
	<br>
	
	<script type="text/javascript" src="main.js"></script>
</body>
</html>
